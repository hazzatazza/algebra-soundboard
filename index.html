<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Soundboard</title>
  <style>
    body {
      background: #1e1e24;
      color: white;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    #searchInput {
      padding: 10px;
      width: 300px;
      max-width: 90%;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a32;
      color: white;
      margin-bottom: 20px;
    }
    #soundboard {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      padding: 20px;
    }
    .sound-button {
      width: 120px;
      height: 120px;
      background-image: url('up.png');
      background-size: cover;
      background-position: center;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 12px;
      color: white;
      font-weight: bold;
      text-shadow: 1px 1px 3px black;
      font-size: 13px;
      text-align: center;
      padding-left: 5px;
      padding-right: 5px;
      overflow: hidden;
      word-break: break-word;
    }
    /* Active / Clicked State */
    .sound-button:active, .sound-button.active {
      background-image: url('down.png') !important;
    }
  </style>
  <script src="sounds.js" type="module" defer></script>
</head>
<body>
  <h1>Soundboard</h1>
  <input type="text" id="searchInput" placeholder="Search sounds...">
  <div id="soundboard">Loading sounds...</div>

  <script type="module">
    import { sounds } from './sounds.js';

    const soundboard = document.getElementById('soundboard');
    const searchInput = document.getElementById('searchInput');

    function renderButtons(filterText = '') {
      soundboard.innerHTML = '';
      
      const filtered = sounds.filter(filename => 
        filename.toLowerCase().includes(filterText.toLowerCase())
      );

      if (filtered.length === 0) {
        soundboard.innerHTML = 'No sounds found.';
        return;
      }

      filtered.forEach(filename => {
        const btn = document.createElement('button');
        btn.className = 'sound-button';
        
        // Remove file extension for clean button text display
        const displayName = filename.replace(/\.[^/.]+$/, "");
        btn.textContent = displayName;

        const audio = new Audio(`sounds/${filename}`);

        // Handle visual click states for mouse and touch
        const setDown = () => btn.classList.add('active');
        const setUp = () => btn.classList.remove('active');

        btn.addEventListener('mousedown', setDown);
        btn.addEventListener('mouseup', setUp);
        btn.addEventListener('mouseleave', setUp);
        
        btn.addEventListener('touchstart', setDown);
        btn.addEventListener('touchend', setUp);

        // Play audio on click
        btn.addEventListener('click', () => {
          audio.currentTime = 0;
          audio.play().catch(err => console.log("Playback blocked:", err));
        });

        soundboard.appendChild(btn);
      });
    }

    // Initial render
    renderButtons();

    // Live search filter listener
    searchInput.addEventListener('input', (e) => {
      renderButtons(e.target.value);
    });
  </script>
</body>
</html>
